# @package _global_
defaults:
  - override /env: mimic
  - override /agent: multi_arch/blendrl_cql/human_neural
  - override /mode: offline
  - override /hydra/sweeper: optuna

experiment_id: "tune_mimic_blendrl_cql"
group: "sepsis"
total_timesteps: 99142
intervals_count: 5  # Sweep across 5 data-efficiency intervals (20%, 40%, 60%, 80%, 100%)
eval_episodes: 100

online_methods: []
offline_methods: [cql, multi_arch/blendrl_cql/human_neural, multi_arch/blendrl_cql/human_cew, multi_arch/blendrl_cql/cew_only]
offline_datasets: [mimic]

agent:
  blender_mode: logic
  hidden_sizes: [256, 256]
  epochs_per_interval: 50
  eval_interval_epochs: 10
  batch_size: 64

mode:
  dataset_path: results/datasets/sepsis/mimic/cql

hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 123
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    direction: maximize
    storage: "sqlite:///optuna_${experiment_id}.db"
    study_name: mimic_blendrl_cql_tuning
    n_trials: 40
    n_jobs: 1
    params:
      agent.lr: interval(1e-4, 1e-3)
      agent.cql_alpha: interval(0.1, 5.0)
      agent.batch_size: choice(32, 64, 128, 256)
      ++agent.ecm_dthr: interval(0.01, 0.5)
      ++agent.soft_target_tau: interval(0.001, 0.1)
      agent.blender_mode: choice('logic', 'neural')
