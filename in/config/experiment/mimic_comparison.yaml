# @package _global_
defaults:
  - override /env: mimic
  - override /agent: blendrl_cql/human_neural
  - override /mode: offline

experiment_id: "mimic_comparison"
group: "mimic"
total_timesteps: 99142
intervals_count: 5  # Evaluate across 5 data-efficiency intervals (20%, 40%, 60%, 80%, 100%)
eval_episodes: 100

online_methods: []
offline_methods: 
  - cql
  - blendrl_cql/human_neural
offline_datasets: [cql]

agent:
  blender_mode: neural
  hidden_sizes: [256, 256]
  epochs_per_interval: 50
  eval_interval_epochs: 10
  batch_size: 64
  lr: 3e-4
  cql_alpha: 1.0
  modules:
    - type: nsfr
      rules: simplified
    - type: neural

mode:
  dataset_path: in/datasets/mimic/cql

save_dataset: false
seed: 1
local: true
recover: false
