# @package _global_
defaults:
  - override /env: mimic

task: early_prediction_tune
experiment_id: tune_early_pred
group: early_prediction

early_prediction:
  checkpoint: "results/checkpoints/mimic/tune_mimic_all"
  dataset_path: "in/datasets/mimic/mimic_lazy_12_clean_with_interventions.npz"
  output_dir: "results/plots/early_prediction/tune_early_pred"
  n_trials: 200
  window_hours: 12
  target_models:
    - lstm_no_v
    - lstm_with_v
    - transformer_no_v
    - transformer_with_v
