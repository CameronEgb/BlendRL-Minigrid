# @package _global_
defaults:
  - pyrenees/_base

consolidate: false 

resources:
  partition: common
  cores: 8
  standalone_cores: 8
  memory: "16G"
  time: "04:00:00"

offline_methods:
  - cql/dnn
  - cql/blendrl_human_neural

agent:
  epochs_per_interval: 50
  eval_interval_epochs: 5
  batch_size: 256
  lr: 3e-4
  cql_alpha: 1.0
  soft_target_tau: 0.005
  blender_lr: 3e-4
