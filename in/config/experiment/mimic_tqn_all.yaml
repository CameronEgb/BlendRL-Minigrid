# @package _global_
defaults:
  - override /env: mimic
  - override /mode: offline

experiment_id: "mimic_tqn_all"
group: "mimic"
total_timesteps: 332139
intervals_count: 1  # Single full-dataset offline training interval (100% data)
eval_episodes: 100

env:
  name: mimic
  dataset_name: mimic_lazy_0_interventions_flag.npz
  reward_type: tqn

online_methods: []
offline_methods: 
  - cql
  - blendrl_cql/human_neural
  - blendrl_cql/human_cew
  - blendrl_cql/cew_only
offline_datasets: [cql]

agent:
  blender_mode: neural
  hidden_sizes: [256, 256]
  epochs_per_interval: 50
  eval_interval_epochs: 10
  batch_size: 64
  lr: 3e-4
  cql_alpha: 1.0
  modules:
    - type: nsfr
      rules: simplified
    - type: neural

mode:
  dataset_path: in/datasets/mimic/cql

save_dataset: false
seed: 1
local: true
recover: false
