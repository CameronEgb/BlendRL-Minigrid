# @package _global_
# Offline-only experiment. No online phase exists for Pyrenees.
defaults:
  - override /agent: blendrl_cql_base
  - override /env: pyrenees
  - override /mode: offline

# ── Architecture ─────────────────────────────────────────────────────────────
env:
  name: pyrenees
  architecture: mlp
  reward_type: outcome
  n_actions: 3              # PS=0, WE=1, FWE=2

# ── Methods ──────────────────────────────────────────────────────────────────
online_methods: []
offline_methods: [blendrl_cql/pyrenees_expert]
offline_datasets: [pyrenees]

# ── Training schedule ────────────────────────────────────────────────────────
# Offline-only. The full dataset is always available. Every training batch
# samples randomly from the entire dataset — there are no data splits.
# total_timesteps: auto dynamically detects exact dataset size at runtime (used as plot x-axis label).
# Total training = epochs_per_interval gradient epochs (intervals_count must be 1).
total_timesteps: auto       # Automatically inferred from offline dataset size
intervals_count: 1          # MUST be 1: ensures reader always uses full dataset

# ── Agent hyperparameters ────────────────────────────────────────────────────
agent:
  name: blendrl_cql
  algorithm: blendrl_cql
  actor_mode: hybrid
  blender_mode: neural
  blend_function: softmax
  lr: 3e-4
  logic_lr: 3e-4
  blender_lr: 3e-4
  batch_size: 256
  # Total training = epochs_per_interval (since intervals_count=1).
  # Increase this for better convergence. 200 epochs recommended as a starting point.
  epochs_per_interval: 200
  # eval_interval_epochs: pause every N epochs to run eval_episodes rollouts.
  # This is independent of intervals_count — it does NOT restrict the dataset.
  # 20 epochs × 10 snapshots = convergence curve with 10 data points.
  eval_interval_epochs: 20
  cql_alpha: 1.0
  soft_target_tau: 0.005
  gamma: 0.99
  ecm_dthr: 0.1
  fyd: false
  modules:
    - type: nsfr
      rules: default

# ── Offline dataset ──────────────────────────────────────────────────────────
mode:
  dataset_path: in/datasets/pyrenees/cql

# ── Experiment metadata ──────────────────────────────────────────────────────
experiment_id: pyrenees_blendrl_expert
group: pyrenees

seed: 42
