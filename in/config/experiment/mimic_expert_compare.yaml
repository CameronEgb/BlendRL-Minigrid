# @package _global_
defaults:
  - override /env: mimic
  - override /agent: blendrl_cql/human_neural
  - override /mode: offline
  - override /hydra/sweeper: optuna

experiment_id: "mimic_expert_compare"
group: "mimic"
total_timesteps: auto
intervals_count: 1

online_methods: []
offline_methods: [cql, blendrl_cql/human_neural]
offline_datasets: [expert_demo]

agent:
  blender_mode: neural
  hidden_sizes: [256, 256]
  epochs_per_interval: 50
  eval_interval_epochs: 10
  batch_size: 64
  modules:
    - type: nsfr
      rules: simplified
    - type: neural

mode:
  dataset_path: in/datasets/mimic/expert_demo

hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 123
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    direction: minimize
    storage: "sqlite:///results/optuna/optuna_${experiment_id}.db"
    study_name: "mimic_expert_compare_${agent.name}"
    n_trials: 40
    n_jobs: 1
    params:
      agent.lr: interval(1e-4, 1e-3)
      agent.cql_alpha: interval(0.1, 5.0)
