agent:
  name: multi_arch_blendrl_cql_human_neural
  algorithm: blendrl_cql
  actor_mode: hybrid
  blender_mode: neural
  blend_function: softmax
  lr: 0.0003041663082077828
  batch_size: 64
  epochs_per_interval: 50
  cql_alpha: 2.801442368506167
  soft_target_tau: 0.005
  gamma: 0.99
  ecm_dthr: 0.1
  fyd: true
  fyd_top_k: 50
  modules:
  - type: nsfr
    rules: simplified
  - type: neural
  hidden_sizes:
  - 256
  - 256
  eval_interval_epochs: 10
env:
  name: mimic
  env_id: mimic
  num_envs: 10
  num_steps: 240
  gamma: 0.99
  gae_lambda: 0.95
  rules: default
  reasoner: nsfr
  architecture: mlp
  reward_type: outcome
mode:
  name: offline
  type: offline
  dataset_path: results/datasets/mimic/mimic/expert_demo
  save_dataset: false
experiment_id: mimic_expert_compare
group: mimic
seed: 1
total_timesteps: 1000
intervals_count: 2
eval_episodes: 2
save_dataset: false
local: true
recover: false
results_dir: results
experiment_dir: ${results_dir}/experiments/${experiment_id}
dataset_root: ${results_dir}/datasets/${experiment_id}
dataset_path: ${dataset_root}/${agent.name}/${hydra:job.num}
online_methods: []
offline_methods:
- cql
- multi_arch/blendrl_cql/human_neural
offline_datasets:
- expert_demo
