# @package _global_
defaults:
  - override /agent: cew
  - override /mode: offline

# Architecture
env:
  name: cartpole
  architecture: mlp

# 1. Run PPO to generate data, then CEW to verify learning
online_methods: [ppo]
offline_methods: [cew]
offline_datasets: [ppo]

total_timesteps: 100000 
intervals_count: 1      
eval_episodes: 100

agent:
  epochs_per_interval: 1000 
  eval_interval_epochs: 50  
  batch_size: 128
  lr: 3e-4                  
  cql_alpha: 0.5            

experiment_id: verify_cew
group: verification
