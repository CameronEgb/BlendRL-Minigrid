agent:
  name: cew
  algorithm: cew
  lr: 0.0001
  batch_size: 32
  epochs_per_interval: 20
  ecm_dthr: 0.13433269846417478
  eps: 0.2666780659946879
  kappa: 0.6
  cql_alpha: 3.629686532749427
  soft_target_tau: 0.005
env:
  name: cartpole
  env_id: CartPole-v1
  num_envs: 4
  num_steps: 500
  gamma: 0.99
  gae_lambda: 0.95
