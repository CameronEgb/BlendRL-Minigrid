# @package _global_
defaults:
  - mimic/_base

name: selected_mimic
experiment_id: selected_mimic

offline_methods:
  - cql/dueling_resnet
  - cql/blendrl_human_dueling_resnet_rigid
  - cql/blendrl_human_dueling_resnet_continuous
  - cql/blendrl_cew_dueling_resnet

agent:
  epochs_per_interval: 25
  eval_interval_epochs: 5
  lr: 2e-4
  cql_alpha: 2.0
  pos_action_weight: 6.0
  blend_ent_coef: 0.1
  ent_coef: 0.05
  weight_decay: 1e-4
