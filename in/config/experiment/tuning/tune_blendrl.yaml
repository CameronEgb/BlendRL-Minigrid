# @package _global_
defaults:
  - override /env: cartpole
  - override /mode: online

# Tuning Experiment for BlendRL on CartPole (10 variants)
experiment_id: tune_blendrl
group: tuning
total_timesteps: 50000
intervals_count: 10
eval_episodes: 100

online_methods: >-
  blendrl/v1,blendrl/v2,blendrl/v3,blendrl/v4,blendrl/v5,
  blendrl/v6,blendrl/v7,blendrl/v8,blendrl/v9,blendrl/v10

offline_methods: 
save_dataset: true
seed: 1
local: true
recover: false
