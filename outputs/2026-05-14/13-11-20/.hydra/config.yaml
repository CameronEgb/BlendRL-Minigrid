tuning:
  blendrl_cp:
    experiment_id: cp_blendrl_fast_500
    agent: blendrl
    env: cartpole
    total_timesteps: 40000
    intervals_count: 10
    eval_episodes: 100
    local: true
    +trainer.accelerator: cpu
    agent.lr: 0.005
    agent.logic_lr: 0.005
    agent.blender_lr: 0.01
    agent.ent_coef: 0.005
    agent.blend_ent_coef: 0.005
    env.num_envs: 4
    env.num_steps: 128
    agent.num_minibatches: 4
    agent.update_epochs: 10
    agent.clip_coef: 0.2
    save_dataset: true
    seed: 1
