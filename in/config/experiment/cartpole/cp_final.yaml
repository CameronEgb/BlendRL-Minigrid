# @package _global_
defaults:
  - override /env: cartpole

# Optimized Final Configuration for CartPole
experiment_id: cp_final
group: cartpole
total_timesteps: 100000
eval_episodes: 100
online_methods: ppo/cp_tuned,ppo/blendrl_cp_tuned
offline_methods: iql/cp_tuned,iql/blendrl_cp_tuned
offline_datasets: ppo/cp_tuned,ppo/blendrl_cp_tuned
intervals_count: 10

# Per-experiment plotter options & metric selection
plots:
  convergence:
    smoothing_window: 10
  losses:
    metrics:
      - losses/actor_loss
      - losses/q_loss
  reports:
    include_hyperparameters: true

save_dataset: true
seed: 1
local: true
recover: false
