agent:
  name: ppo
  algorithm: ppo
  lr: 0.0003
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  clip_coef: 0.2
  update_epochs: 10
  num_minibatches: 4
  batch_size: 64
  anneal_lr: true
  norm_adv: true
  clip_vloss: true
  hidden_sizes:
  - 64
  - 64
env:
  name: cartpole
  env_id: CartPole-v1
  num_envs: 4
  num_steps: 500
  gamma: 0.99
  gae_lambda: 0.95
  rules: default
  reasoner: nsfr
  architecture: mlp
mode:
  name: online
  type: online
  save_dataset: true
experiment_id: default_exp
seed: 1
total_timesteps: 10000
intervals_count: 4
eval_episodes: 100
save_dataset: true
local: true
recover: false
results_dir: results
experiment_dir: ${results_dir}/experiments/${experiment_id}
dataset_root: ${results_dir}/datasets/${experiment_id}
dataset_path: ${dataset_root}/${agent.name}
