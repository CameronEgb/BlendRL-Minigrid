# @package _global_
defaults:
  - override /env: cartpole
  - override /agent: ppo
  - override /mode: online
  - override /hydra/sweeper: optuna
experiment_id: tune_ppo
group: tuning
seed: 1
total_timesteps: 100000
intervals_count: 5
eval_episodes: 10
save_dataset: false

hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 123
      consider_prior: true
      prior_weight: 1.0
      consider_magic_number: true
      consider_endpoints: false
      n_startup_trials: 5
      n_ei_candidates: 24
      multivariate: false
      warn_independent_sampling: true
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    direction: maximize
    storage: "sqlite:///results/optuna/optuna_${experiment_id}.db"
    study_name: ppo_tuning
    n_trials: 10
    n_jobs: 1
    params:
      agent.lr: interval(1e-4, 1e-2)
      agent.ent_coef: interval(0.0, 0.1)
