env:
  name: mountaincar
  env_id: MountainCar-v0
  num_envs: 1
  num_steps: 2048
  gamma: 0.99
  gae_lambda: 0.95
  rules: default
  reasoner: nsfr
  architecture: mlp
agent:
  name: ppo
  algorithm: ppo
  lr: 0.00025
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  clip_coef: 0.1
  update_epochs: 4
  num_minibatches: 4
  anneal_lr: true
  norm_adv: true
  clip_vloss: true
mode:
  name: online
  type: online
  save_dataset: true
experiment_id: demo_mc_ppo
group: ''
seed: 1
total_timesteps: 100
intervals_count: 1
eval_episodes: 5
save_dataset: true
use_large_dataset_path: true
large_dataset_path: ''
local: false
recover: false
trainer:
  limit_train_batches: 1
  max_epochs: 1
  accelerator: cpu
  devices: 1
