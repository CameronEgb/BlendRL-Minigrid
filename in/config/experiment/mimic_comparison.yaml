# @package _global_
defaults:
  - override /env: mimic
  - override /agent: blendrl_cql/human_neural
  - override /mode: offline

experiment_id: "mimic_comparison"
group: "mimic"
total_timesteps: auto
intervals_count: 1

online_methods: []
offline_methods: 
  - cql
  - blendrl_cql/human_neural
offline_datasets: [mimic_lazy_0_interventions_balanced]

agent:
  blender_mode: neural
  hidden_sizes: [256, 256]
  epochs_per_interval: 250
  eval_interval_epochs: 25
  batch_size: 256
  lr: 3e-4
  cql_alpha: 1.0
  modules:
    - type: nsfr
      rules: simplified
    - type: neural

mode:
  dataset_path: in/datasets/mimic/mimic_lazy_0_interventions_balanced

plots:
  losses:
    metrics: ["losses/total_loss", "losses/bellman_loss", "losses/cql_loss", "losses/entropy"]
  policy_eval: {}
  reports: {}

save_dataset: false
seed: 1
local: true
recover: false
