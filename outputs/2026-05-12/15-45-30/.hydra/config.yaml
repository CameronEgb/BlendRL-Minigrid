env:
  name: cartpole
  env_id: CartPole-v1
  num_envs: 8
  num_steps: 128
  gamma: 0.99
  gae_lambda: 0.95
  rules: default
  reasoner: nsfr
  architecture: mlp
agent:
  name: ppo
  algorithm: ppo
  lr: 0.00025
