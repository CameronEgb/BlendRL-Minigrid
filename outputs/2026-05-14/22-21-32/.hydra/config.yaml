agent:
  name: blendrl_iql
  algorithm: blendrl_iql
  lr: 0.0003
  logic_lr: 0.0003
  blender_lr: 0.0003
  tau: 0.7
  beta: 3.0
  batch_size: 256
  epochs_per_interval: 10
  blend_ent_coef: 0.01
  blender_mode: logic
  blend_function: softmax
  actor_mode: hybrid
env:
  name: cartpole
  env_id: CartPole-v1
  num_envs: 4
  num_steps: 500
  gamma: 0.99
  gae_lambda: 0.95
  rules: default
  reasoner: nsfr
  architecture: mlp
mode:
  name: offline
  type: offline
  dataset_path: results/datasets/cp_final/ppo
  save_dataset: false
experiment_id: test_fix2
seed: 1
total_timesteps: 2000
intervals_count: 2
eval_episodes: 5
save_dataset: true
use_large_dataset_path: true
large_dataset_path: ''
local: true
recover: false
results_dir: results
experiment_dir: ${results_dir}/experiments/${experiment_id}
dataset_root: ${results_dir}/datasets/${experiment_id}
dataset_path: ${dataset_root}/${agent.name}
