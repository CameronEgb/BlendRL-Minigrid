# @package _global_
defaults:
  - tuning/_base
  - override /env: cartpole
  - override /agent: cew/base

total_timesteps: 100000
intervals_count: 10
eval_episodes: 100
online_methods: []
offline_methods: cew,cew_fyd
offline_datasets: ppo/cp_tuned

agent:
  lr: 3e-4
  batch_size: 32
  epochs_per_interval: 100
  ecm_dthr: 0.1
  eps: 0.2
  kappa: 0.6
  cql_alpha: 1.0

env:
  gamma: 0.99

recover: false
