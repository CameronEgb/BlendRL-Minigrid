# @package _global_
defaults:
  - pyrenees/_base
  - override /agent: cql/blendrl_human_dueling_resnet
  - override /hydra/sweeper: optuna_offline

experiment_id: tune_pyrenees_blendrl_resnet
group: pyrenees

offline_datasets:
  - problem
  - ex132(w)
  - ex132a(w)
  - ex152a(w)
  - ex212(w)
  - ex242(w)
  - ex252(w)
  - ex252a(w)
  - exc137(w)
  - exp426d(w)
  - exp426e(w)

offline_methods:
  - cql/blendrl_human_dueling_resnet

agent:
  epochs_per_interval: 35
  eval_interval_epochs: 5
  batch_size: 512

hydra:
  sweeper:
    storage: null
    study_name: "pyrenees_blendrl_human_dueling_resnet"
    direction: minimize
    n_trials: 35
    n_jobs: 12
    params:
      agent.lr: tag(log, interval(5e-5, 2e-3))
      agent.cql_alpha: tag(log, interval(0.05, 5.0))
      agent.soft_target_tau: interval(0.001, 0.03)
      agent.blender_lr: tag(log, interval(5e-5, 2e-3))
