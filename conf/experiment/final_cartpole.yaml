# @package _global_
defaults:
  - override /env: cartpole
  - override /hydra/sweeper: optuna

# Culminating Experiment for CartPole
experiment_id: final_cartpole
group: ungrouped
total_timesteps: 100000
eval_episodes: 100
intervals_count: 10

# Phase 1: High-Performance Online Generation
online_methods: ppo/final_cp,blendrl/final_cp

# Phase 2: Comprehensive Offline Comparison
offline_methods: >-
  iql/cp_tuned,blendrl_iql/cp_tuned,
  multi_arch/arch1,multi_arch/arch2,multi_arch/arch3

# Only train on the absolute best online datasets
offline_datasets: ppo/final_cp,blendrl/final_cp

save_dataset: true
seed: 1
local: false
recover: false

hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 10
    direction: maximize
    storage: "sqlite:///results/optuna/optuna_${experiment_id}.db"
    study_name: "final_cp_${agent.name}"
    n_trials: 50
    n_jobs: 1
    params:
      # Tuning the Offline-specific Logic
      ++agent.tau: interval(0.5, 0.95)
      ++agent.beta: interval(1.0, 10.0)
      ++agent.lr: interval(1e-4, 5e-3)
      
      # Architecture exploration for multi_arch runs
      # (Placeholders allow these to be safely passed even if not used by all)
      ++agent.logic_lr: interval(1e-4, 5e-3)
      ++agent.blend_ent_coef: interval(0.0, 0.05)
