# @package _global_
defaults:
  - pyrenees/_base
  - override /agent: cql/dnn

name: pyrenees_scaled
experiment_id: pyrenees_scaled

offline_datasets:
  - pyrenees

offline_methods:
  - cql/dnn
  - cql/dueling_resnet
  - cql/blendrl_human_neural

agent:
  epochs_per_interval: 50
  eval_interval_epochs: 10
  batch_size: 512
  lr: 3e-4
  cql_alpha: 1.0

plots:
  losses:
    metrics: ["losses/total_loss", "losses/bellman_loss", "losses/cql_loss", "losses/q_loss", "losses/actor_loss"]
  policy_eval: {}
  reports: {}
