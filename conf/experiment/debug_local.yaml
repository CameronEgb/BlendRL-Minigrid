# @package _global_
defaults:
  - override /agent: cew
  - override /mode: offline

env:
  name: cartpole
  architecture: mlp

online_methods: []
offline_methods: [cew]
offline_datasets: [ppo_cp_tuned]

total_timesteps: 10000 
intervals_count: 1      
eval_episodes: 5

agent:
  epochs_per_interval: 5 
  eval_interval_epochs: 1 
  batch_size: 32
  lr: 1e-3                  
  cql_alpha: 0.1
  ecm_dthr: 0.1 # Create more rules
  eps: 0.1     # Make memberships narrower
  kappa: 0.6

mode:
  dataset_path: in/datasets/ungrouped/cp_final/ppo_cp_tuned
experiment_id: debug_local
group: quick_tests
