# @package _global_
defaults:
  - pyrenees/_base

experiment_id: pyrenees_cql_vs_blendrl_dnn
group: pyrenees
consolidate: true

offline_datasets:
  - problem
  - ex132(w)
  - ex132a(w)
  - ex152a(w)
  - ex212(w)
  - ex242(w)
  - ex252(w)
  - ex252a(w)
  - exc137(w)
  - exp426d(w)
  - exp426e(w)

offline_methods:
  - cql/dnn
  - cql/blendrl_human_neural

agent:
  epochs_per_interval: 50
  eval_interval_epochs: 5
  batch_size: 256
  lr: 3e-4
  cql_alpha: 1.0
  soft_target_tau: 0.005
  blender_lr: 3e-4

plots:
  losses:
    metrics: ["losses/total_loss", "losses/bellman_loss", "losses/cql_loss", "losses/q_loss", "losses/actor_loss"]
  action_distribution: {}
  reports: {}

resources:
  time: "02:00:00"
  gpus: 1
  cores: 16
  memory: "32G"
