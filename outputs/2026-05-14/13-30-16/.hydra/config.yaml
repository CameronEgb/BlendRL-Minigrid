env:
  name: cartpole
  env_id: CartPole-v1
  num_envs: 4
  num_steps: 128
  gamma: 0.99
  gae_lambda: 0.95
  rules: default
  reasoner: nsfr
  architecture: mlp
agent:
  name: blendrl
  algorithm: blender
  lr: 0.005
  logic_lr: 0.005
  blender_lr: 0.01
  ent_coef: 0.005
  blend_ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.5
  clip_coef: 0.2
  update_epochs: 10
  num_minibatches: 4
  anneal_lr: true
  batch_size: 64
  norm_adv: true
  clip_vloss: true
  blender_mode: logic
  blend_function: softmax
  actor_mode: hybrid
  joint_training: false
  pretrained: false
mode:
  name: online
  type: online
  save_dataset: true
experiment_id: cp_blendrl_fast_500_s1
group: ''
seed: 1
total_timesteps: 40000
intervals_count: 10
eval_episodes: 100
save_dataset: true
use_large_dataset_path: true
large_dataset_path: ''
local: true
recover: false
trainer:
  accelerator: cpu
