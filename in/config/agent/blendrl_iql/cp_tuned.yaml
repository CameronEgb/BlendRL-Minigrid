defaults:
  - /agent: blendrl_iql_base
  - _self_

lr: 3e-4
logic_lr: 3e-4
blender_lr: 3e-4
tau: 0.7
beta: 3.0
batch_size: 256
epochs_per_interval: 10

# Placeholders for sweep compatibility
ent_coef: 0.01
clip_coef: 0.2
blend_ent_coef: 0.001
blender_mode: logic
blend_function: softmax
actor_mode: hybrid
