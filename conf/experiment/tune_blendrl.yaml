# @package _global_
defaults:
  - override /env: cartpole
  - override /mode: online

# Tuning Experiment for BlendRL on CartPole (10 variants)
experiment_id: tune_blendrl_v2
group: tuning
total_timesteps: 50000
intervals_count: 10
eval_episodes: 100

online_methods: >-
  blendrl/tuning/v1,blendrl/tuning/v2,blendrl/tuning/v3,blendrl/tuning/v4,blendrl/tuning/v5,
  blendrl/tuning/v6,blendrl/tuning/v7,blendrl/tuning/v8,blendrl/tuning/v9,blendrl/tuning/v10

offline_methods: 
save_dataset: true
seed: 1
local: true
recover: false
