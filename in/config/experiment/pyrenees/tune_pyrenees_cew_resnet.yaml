# @package _global_
defaults:
  - pyrenees/_base
  - override /agent: cql/blendrl_human_cew_dueling_resnet
  - override /hydra/sweeper: optuna_offline

experiment_id: tune_pyrenees_cew_resnet
group: pyrenees

agent:
  epochs_per_interval: 15
  eval_interval_epochs: 3
  batch_size: 512

hydra:
  sweeper:
    storage: "sqlite:///results/optuna/optuna_pyrenees_scaled.db?timeout=120"
    study_name: "pyrenees_blendrl_cew_dueling_resnet"
    direction: minimize
    n_trials: 35
    n_jobs: 1
    params:
      agent.lr: interval(1e-4, 1e-3)
      agent.cql_alpha: interval(0.1, 5.0)
      agent.ecm_dthr: interval(0.01, 0.08)
      agent.fyd_top_k: choice(50, 150, 300)
