# @package _global_
defaults:
  - override /env: mimic
  - override /agent: blendrl_cql/human_neural
  - override /mode: offline
  - override /hydra/sweeper: optuna

experiment_id: "tune_mimic_all"
group: mimic
total_timesteps: auto
intervals_count: 1

online_methods: []
offline_methods: [cql, blendrl_cql/human_neural, blendrl_cql/human_cew, cew_fyd]
offline_datasets: [cql]

agent:
  blender_mode: logic
  hidden_sizes: [256, 256]
  epochs_per_interval: 10
  eval_interval_epochs: 2
  batch_size: 256

mode:
  dataset_path: in/datasets/mimic/cql

hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 123
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    direction: minimize
    storage: "sqlite:///results/optuna/optuna_${experiment_id}.db"
    study_name: "tune_mimic_all_${agent.name}"
    n_trials: 40
    n_jobs: 1
    params:
      agent.lr: interval(1e-4, 1e-3)
      agent.cql_alpha: interval(0.1, 5.0)
      agent.batch_size: choice(32, 64, 128, 256)
      ++agent.ecm_dthr: interval(0.01, 0.5)
      ++agent.soft_target_tau: interval(0.001, 0.1)
      agent.blender_mode: choice('logic', 'neural')
