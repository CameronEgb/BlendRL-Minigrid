# @package _global_
defaults:
  - override /env: mimic
  - override /agent: cql_base
  - override /mode: offline

experiment_id: "mimic_test"
group: "mimic"

total_timesteps: auto
intervals_count: 1

online_methods: []
offline_methods: 
  - cql
  - blendrl_cql/human_neural
offline_datasets: [mimic_lazy_0_interventions_balanced]

agent:
  epochs_per_interval: 2
  eval_interval_epochs: 1
  batch_size: 256
  lr: 3e-4
  cql_alpha: 1.0

mode:
  dataset_path: in/datasets/mimic/mimic_lazy_0_interventions_balanced

plots:
  losses:
    metrics: ["losses/total_loss", "losses/bellman_loss", "losses/cql_loss", "losses/entropy"]
  policy_eval: {}
  reports: {}

save_dataset: false
seed: 42
local: true
recover: false

