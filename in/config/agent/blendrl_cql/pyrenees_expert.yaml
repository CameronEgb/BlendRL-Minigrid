name: blendrl_cql
algorithm: blendrl_cql
actor_mode: hybrid
blender_mode: neural       # neural blender learns when to trust logic vs. neural
blend_function: softmax
lr: 3e-4
logic_lr: 3e-4
blender_lr: 3e-4
batch_size: 256
epochs_per_interval: 10
cql_alpha: 1.0
soft_target_tau: 0.005
gamma: 0.99
ecm_dthr: 0.1
fyd: false

# NSFR logic module with competency-tier expert rules
modules:
  - type: nsfr
    rules: default
