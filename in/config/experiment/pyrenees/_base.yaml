# @package _global_
defaults:
  - override /env: pyrenees
  - override /agent: cql/dnn
  - override /mode: offline


offline_datasets:
  - problem
  - ex132(w)
  - ex132a(w)
  - ex152a(w)
  - ex212(w)
  - ex242(w)
  - ex252(w)
  - ex252a(w)
  - exc137(w)
  - exp426d(w)
  - exp426e(w)

offline_methods: [cql/dnn]

resources:
  time: "02:00:00"
  gpus: 1
  cores: 16
  memory: "32G"

agent:
  epochs_per_interval: 20
  eval_interval_epochs: 5
  batch_size: 256
  lr: 3e-4
  cql_alpha: 1.0
  soft_target_tau: 0.005
  blender_lr: 3e-4
