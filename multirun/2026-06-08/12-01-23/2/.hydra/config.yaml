agent:
  name: multi_arch_blendrl_cql_human_cew
  algorithm: blendrl_cql
  actor_mode: hybrid
  blender_mode: neural
  blend_function: softmax
  lr: 0.0048612258246951735
  batch_size: 256
  epochs_per_interval: 2
  cql_alpha: 2.0213758391513377
  soft_target_tau: 0.07317592103102012
  gamma: 0.99
  ecm_dthr: 0.178157227913926
  fyd: true
  fyd_top_k: 50
  modules:
  - type: nsfr
    rules: default
  - type: cew
    fyd: true
env:
  name: cartpole
  env_id: CartPole-v1
  num_envs: 4
  num_steps: 500
  gamma: 0.99
  gae_lambda: 0.95
  rules: default
  reasoner: nsfr
  architecture: mlp
mode:
  name: offline
  type: offline
  dataset_path: results/datasets/tuning/tune_human_cew_poc/ppo_cp_tuned
  save_dataset: false
experiment_id: tune_human_cew_poc
group: tuning
seed: 1
total_timesteps: 10000
intervals_count: 2
eval_episodes: 20
save_dataset: true
local: true
recover: false
results_dir: results
experiment_dir: ${results_dir}/experiments/${experiment_id}
dataset_root: ${results_dir}/datasets/${experiment_id}
dataset_path: ${dataset_root}/${agent.name}/${hydra:job.num}
online_methods: ppo/cp_tuned
offline_methods: multi_arch/blendrl_cql/human_cew
