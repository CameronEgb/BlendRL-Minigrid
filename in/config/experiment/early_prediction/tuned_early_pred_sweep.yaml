defaults:
  - override /env: mimic

task: early_prediction_sweep

early_prediction:
  checkpoint: "results/checkpoints/mimic/tune_mimic_all"
  dataset_path: "in/datasets/mimic/mimic_lazy_12_clean_with_interventions.npz"
  output_dir: "results/plots/early_prediction"
  tune_dir: "results/plots/early_prediction/tune_early_pred"
  use_tuned_params: true
  save_checkpoints: true
  tau_min: 1
  tau_max: 33
  tau_step: 4
  window_hours: 12
  n_splits: 20

plots:
  - ep_dl_sweep
  - ep_agreement
  - ep_trajectories
  - ep_counterfactual_table
