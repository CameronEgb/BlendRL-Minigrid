hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 123
      consider_prior: true
      prior_weight: 1.0
      consider_magic_clip: true
      consider_endpoints: false
      n_startup_trials: 10
      n_ei_candidates: 24
      multivariate: false
      warn_independent_sampling: true
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    direction: maximize
    storage: sqlite:///optuna.db
    study_name: cew_tuning_v1
    n_trials: 20
    n_jobs: 1
    search_space: null
    params:
      agent.epochs_per_interval: '50'
      agent.ecm_dthr: interval(0.01, 0.2)
      agent.kappa: interval(0.5, 0.9)
      agent.eps: interval(0.1, 0.4)
      agent.cql_alpha: interval(0.1, 5.0)
      agent.lr: choice(1e-4, 3e-4, 1e-3)
      agent.batch_size: choice(16, 32, 64)
    custom_search_space: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - agent.ecm_dthr=0.13433269846417478
    - agent.cql_alpha=3.629686532749427
    - agent.eps=0.2666780659946879
    - agent.lr=0.0001
    - agent.batch_size=32
    - agent.epochs_per_interval=20
    - +experiment=tune_cew
    - local=True
  job:
    name: train
    chdir: null
    override_dirname: +experiment=tune_cew,agent.batch_size=32,agent.cql_alpha=3.629686532749427,agent.ecm_dthr=0.13433269846417478,agent.epochs_per_interval=20,agent.eps=0.2666780659946879,agent.lr=0.0001,local=True
    id: '11'
    num: 11
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /Users/cameronegbert/Documents/NCSU/Research/NeSyRL
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /Users/cameronegbert/Documents/NCSU/Research/NeSyRL/conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /Users/cameronegbert/Documents/NCSU/Research/NeSyRL/multirun/2026-06-04/06-46-10/11
    choices:
      experiment: tune_cew
      mode: offline
      env: cartpole
      agent: cew
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: optuna
      hydra/sweeper/sampler: tpe
      hydra/launcher: basic
      hydra/output: default
  verbose: false
