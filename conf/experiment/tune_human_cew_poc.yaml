# @package _global_
defaults:
  - override /env: cartpole
  - override /hydra/sweeper: optuna
  - _self_

experiment_id: tune_human_cew_poc
group: tuning
total_timesteps: 10000
eval_episodes: 20
online_methods: ppo/cp_tuned
offline_methods: multi_arch/blendrl_cql/human_cew
intervals_count: 2

agent:
  epochs_per_interval: 2

env:
  architecture: mlp
  rules: default

save_dataset: true
seed: 1
local: true

hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 123
      n_startup_trials: 3
    direction: maximize
    n_trials: 5
    n_jobs: 1
    storage: "sqlite:///optuna.db"
    study_name: tune_human_cew_poc
    params:
      agent.lr: interval(1e-4, 1e-2)
      agent.cql_alpha: interval(0.1, 5.0)
      agent.ecm_dthr: interval(0.01, 0.5)
      agent.soft_target_tau: interval(0.001, 0.1)
