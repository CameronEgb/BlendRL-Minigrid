# @package _global_
defaults:
  - cew/_base
  - override /agent: cew/fyd
  - override /mode: offline

# Architecture
env:
  name: cartpole
  architecture: mlp

# Use existing expert PPO data
online_methods: []
offline_methods: [cew]
offline_datasets: [ppo_cp_tuned]

total_timesteps: 100000 
intervals_count: 1      
eval_episodes: 100

agent:
  epochs_per_interval: 200 # Faster verification
  eval_interval_epochs: 10  
  batch_size: 64            
  lr: 3e-4                  
  cql_alpha: 0.1            
  ecm_dthr: 0.1             
  eps: 0.1                  
  kappa: 0.6
  # Let FYD use Kneedle by not setting fyd_top_k here
  fyd_top_k: null

mode:
  dataset_path: in/datasets/ungrouped/cp_final/ppo_cp_tuned

