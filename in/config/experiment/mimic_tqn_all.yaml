# @package _global_
defaults:
  - override /env: mimic
  - override /mode: offline

experiment_id: "mimic_tqn_all"
group: "mimic"
total_timesteps: 332139
intervals_count: 1  # Single full-dataset offline training interval (100% data)
eval_episodes: 100
consolidate: true   # Consolidate all methods and plotting into a single 1-GPU Slurm job

env:
  name: mimic
  dataset_name: mimic_lazy_0_interventions_flag.npz
  reward_type: tqn

online_methods: []
offline_methods: 
  - cql
  - blendrl_cql/human_neural
  - blendrl_cql/human_cew
  - cew_fyd
offline_datasets: [cql]

agent:
  blender_mode: neural
  hidden_sizes: [512, 512]
  epochs_per_interval: 30
  eval_interval_epochs: 5
  batch_size: 1024
  lr: 5e-4
  cql_alpha: 1.0
  modules:
    - type: nsfr
      rules: simplified
    - type: neural

mode:
  dataset_path: in/datasets/mimic/cql

save_dataset: false
seed: 1
local: true
recover: false

